services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queueflow
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
    ports:
      - "5432:5432"
    volumes:
      - queueflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://queueflow:queueflow@db:5432/queueflow
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  queueflow-db:
